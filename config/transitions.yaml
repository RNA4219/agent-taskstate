workflow: default

statuses:
  - draft
  - proposed
  - ready
  - in_progress
  - blocked
  - review
  - done
  - cancelled
  - archived

terminal_states:
  - done
  - cancelled
  - archived

transitions:
  draft:
    allowed: [ready, archived]
  proposed:
    allowed: [ready, cancelled]
  ready:
    allowed: [in_progress, cancelled]
  in_progress:
    allowed: [blocked, review, cancelled]
  blocked:
    allowed: [in_progress, cancelled]
  review:
    allowed: [in_progress, done, cancelled]
  done:
    allowed: [in_progress, archived]
  cancelled:
    allowed: []
  archived:
    allowed: []

reason_required:
  - from: done
    to: in_progress
  - from: "*"
    to: done
  - from: "*"
    to: cancelled
  - from: "*"
    to: archived

actor_types: [human, agent, system]
