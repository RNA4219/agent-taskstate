name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install ".[dev]"
      - run: ruff check src/agent_taskstate src/agent_taskstate_workflow_plugin
      - run: ruff format --check src/agent_taskstate src/agent_taskstate_workflow_plugin
      - run: mypy src/agent_taskstate/typed_ref.py src/agent_taskstate/state_transition.py src/agent_taskstate/transition_config.py src/agent_taskstate/context_bundle.py src/agent_taskstate/resolver.py src/agent_taskstate/tracker_bridge.py --ignore-missing-imports --follow-imports=skip
      - run: pytest --cov=agent_taskstate --cov-report=term-missing --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Clean install and CLI smoke
        run: |
          python -m venv /tmp/agent-taskstate-clean
          /tmp/agent-taskstate-clean/bin/python -m pip install dist/*.whl
          /tmp/agent-taskstate-clean/bin/agent-taskstate --help
          /tmp/agent-taskstate-clean/bin/agent-taskstate --db /tmp/agent-taskstate.db init
          /tmp/agent-taskstate-clean/bin/agent-taskstate --db /tmp/agent-taskstate.db task create --json '{"kind":"feature","title":"smoke","goal":"smoke"}'
          /tmp/agent-taskstate-clean/bin/agent-taskstate --db /tmp/agent-taskstate.db task list
